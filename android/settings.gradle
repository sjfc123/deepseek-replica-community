/* ============================================================================
 * 功能区：构建配置 / Gradle 工程结构
 * 职责：声明插件与依赖仓库、工程名称和应用模块，供 Gradle 装配 Android 构建。
 * 分区：01 仓库与解析策略；02 工程名称与模块
 * 关联：被 gradlew 读取；应用模块配置见 app/build.gradle。
 * 导出：无模块导出；Gradle 工程 DeepSaga 与 :app 模块。
 * 边界：只声明仓库与模块结构；不包含版本号、签名或业务构建参数。
 * ========================================================================== */

/* ---- 01 仓库与解析策略 ---- */
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

/* ---- 02 工程名称与模块 ---- */
rootProject.name = 'DeepSaga'
include ':app'
